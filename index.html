<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Rehber Harita</title>
  <meta name="description" content="Rehberli turlar için etkileşimli il haritası: yer şekilleri, 3B arazi, tarihi ve kültürel noktalar.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rehber Harita">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" role="application" aria-label="Harita"></div>

  <!-- Başlık -->
  <header class="title-chip">
    <button class="prov-btn" id="btnProv" data-i18n-title="prov.choose">
      <img src="icons/app/icon.svg" alt="" width="28" height="28">
      <div>
        <div class="title"><span id="provName">Nevşehir · Kapadokya</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="subtitle" id="baseName"></div>
      </div>
    </button>
  </header>

  <!-- İl seçici -->
  <section class="popover prov" id="provPanel" hidden aria-label="İl">
    <div class="pop-head"><h2 data-i18n="prov.choose"></h2><button class="x" data-close="provPanel" aria-label="Kapat">×</button></div>
    <div class="prov-list" id="provList"></div>
  </section>

  <!-- Sağ üst araç çubuğu -->
  <nav class="toolbar" id="toolbar" aria-label="Araçlar">
    <button class="tb-toggle" id="tbToggle" aria-expanded="true">
      <svg class="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="ic-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      <span data-i18n="menu"></span>
    </button>
    <div class="tb-groups" id="tbGroups">
      <div class="tb-group">
        <div class="tb-gtitle" data-i18n="grp.explore"></div>
        <button class="tool" id="btnSearch" data-i18n-title="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-i18n="search"></span></button>
        <button class="tool" id="btnLegend" data-i18n-title="legend"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="5" cy="18" r="2"/><path d="M10 6h11M10 12h11M10 18h11"/></svg><span data-i18n="legend"></span><b class="badge" id="legendBadge" hidden></b></button>
        <button class="tool" id="btnTour" data-i18n-title="tour" hidden><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span data-i18n="tour"></span><b class="badge" id="tourBadge" hidden></b></button>
      </div>
      <div class="tb-group">
        <div class="tb-gtitle" data-i18n="grp.map"></div>
        <button class="tool" id="btnLayers" data-i18n-title="layers"><svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13 10 5.5L22 13"/><path d="m2 17.5 10 5.5 10-5.5" opacity=".5"/></svg><span data-i18n="layers"></span></button>
        <button class="tool" id="btn3d"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span id="lbl3d">3B</span></button>
        <button class="tool" id="btnDiorama" data-i18n-title="d.title"><svg viewBox="0 0 24 24"><path d="M3 15 12 19l9-4M3 15V9l9-4 9 4v6M3 9l9 4 9-4M12 13v6"/></svg><span data-i18n="d.title"></span></button>
        <button class="tool" id="btnTime" data-i18n-title="h.time"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg><span data-i18n="h.time"></span></button>
      </div>
      <div class="tb-group">
        <div class="tb-gtitle" data-i18n="grp.settings"></div>
        <button class="tool" id="btnTheme" data-i18n-title="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/></svg><span id="lblTheme"></span></button>
        <button class="tool" id="btnLang" data-i18n-title="language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="lblLang">TR</span></button>
        <button class="tool" id="btnLocate" data-i18n-title="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg><span data-i18n="locate"></span></button>
      </div>
    </div>
  </nav>

  <!-- Yakınlaştırma + irtifa -->
  <div class="zoombar" aria-label="Yakınlaştırma">
    <button id="zoomIn" data-i18n-title="zoomIn" aria-label="+">+</button>
    <div class="vslider">
      <input type="range" id="altSlider" min="5" max="18" step="0.05" aria-label="İrtifa">
    </div>
    <button id="zoomOut" data-i18n-title="zoomOut" aria-label="−">−</button>
    <div class="alt-readout"><span data-i18n="altitude"></span><b id="altValue"></b></div>
    <button id="compass" class="compass" hidden aria-label="Kuzey"><svg viewBox="0 0 24 24"><path d="M12 2 8 12h8L12 2Z" fill="#d6453d" stroke="none"/><path d="M12 22l4-10H8l4 10Z" fill="currentColor" stroke="none" opacity=".55"/></svg></button>
  </div>

  <!-- 3B yükselti ölçeği -->
  <div class="exag-panel" id="exagPanel" hidden>
    <label for="exagSlider"><span data-i18n="exaggeration"></span> <b id="exagValue">1.5×</b></label>
    <input type="range" id="exagSlider" min="1" max="4" step="0.1" value="1.5">
  </div>

  <!-- Katman seçici -->
  <section class="popover" id="layersPanel" hidden aria-label="Katmanlar">
    <div class="pop-head"><h2 data-i18n="layers"></h2><button class="x" data-close="layersPanel" aria-label="Kapat">×</button></div>
    <div class="base-grid" id="baseGrid"></div>
    <div id="lcKey" class="lc-key" hidden></div>
    <h3 class="opt-title" data-i18n="opt.title"></h3>
    <label class="opt-row"><span><b data-i18n="opt.b3d"></b><small data-i18n="opt.b3dNote"></small></span>
      <span class="switch"><input type="checkbox" id="optB3d"><span></span></span></label>
    <label class="opt-row"><span><b data-i18n="opt.mon3d"></b><small data-i18n="opt.mon3dNote"></small></span>
      <span class="switch"><input type="checkbox" id="optMon3d"><span></span></span></label>
  </section>

  <!-- Dil seçici -->
  <section class="popover small" id="langPanel" hidden aria-label="Dil">
    <div class="pop-head"><h2 data-i18n="language"></h2><button class="x" data-close="langPanel" aria-label="Kapat">×</button></div>
    <div class="lang-list" id="langList"></div>
  </section>

  <!-- Lejant -->
  <aside class="sheet legend" id="legendPanel" hidden aria-label="Lejant">
    <div class="grab"></div>
    <div class="pop-head">
      <h2 data-i18n="legend"></h2>
      <button class="text-btn" id="allOff" data-i18n="allOff"></button>
      <button class="x" data-close="legendPanel" aria-label="Kapat">×</button>
    </div>
    <div class="legend-body" id="legendBody"></div>
  </aside>

  <!-- Arama -->
  <section class="popover search" id="searchPanel" hidden aria-label="Arama">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" aria-label="Ara">
      <button class="x" id="searchClose" aria-label="Kapat">×</button>
    </div>
    <ul class="search-results" id="searchResults"></ul>
  </section>

  <!-- Bugünkü tur -->
  <aside class="sheet tour" id="tourPanel" hidden aria-label="Tur">
    <div class="grab"></div>
    <div class="pop-head">
      <div class="t-title"><h2 id="tourTitle"></h2><small id="tourDate"></small></div>
      <button class="x" data-close="tourPanel" aria-label="Kapat">×</button>
    </div>
    <div class="tour-body" id="tourBody"></div>
  </aside>

  <!-- Bilgi kartı -->
  <article class="sheet card" id="card" hidden aria-live="polite"></article>

  <!-- Zaman kaydırıcısı -->
  <section class="timebar" id="timebar" hidden aria-label="Zaman">
    <div class="tb-head">
      <button class="x" id="tbPrev" aria-label="Önceki olay">‹</button>
      <div class="tb-year" id="tbYear"></div>
      <button class="x" id="tbNext" aria-label="Sonraki olay">›</button>
      <button class="text-btn" id="tbClose" data-i18n="h.today"></button>
    </div>
    <div class="tb-track">
      <input type="range" id="tbSlider" aria-label="Yıl">
      <div class="tb-ticks" id="tbTicks"></div>
    </div>
    <p class="tb-states" id="tbStates"></p>
    <ul class="tb-events" id="tbEvents"></ul>
    <p class="tb-note" id="tbNote"></p>
  </section>

  <!-- Diorama -->
  <section class="diorama" id="diorama" hidden aria-label="Diorama">
    <div class="dio-stage" id="dioStage"></div>
    <div class="dio-top">
      <button class="dio-back" id="dioClose" data-i18n-title="d.close"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="d.close"></span></button>
      <div class="dio-title" id="dioTitle"></div>
    </div>
    <div class="dio-controls">
      <label class="chk"><input type="checkbox" id="dioUnder"><span data-i18n="d.under"></span></label>
      <label class="chk"><input type="checkbox" id="dioLabels" checked><span data-i18n="d.labels"></span></label>
      <label class="chk"><input type="checkbox" id="dioRotate" checked><span data-i18n="d.rotate"></span></label>
      <label class="dio-exag"><span data-i18n="exaggeration"></span><input type="range" id="dioExag" min="1" max="5" step="0.1" value="2"><b id="dioExagV">2.0×</b></label>
    </div>
    <div class="dio-list" id="dioLegend" hidden>
      <button class="dio-list-head" id="dioListToggle" aria-expanded="false"><span id="dioListTitle"></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="dio-list-body" id="dioListBody" hidden></div>
    </div>
    <div class="dio-hint" id="dioHint"></div>
    <div class="dio-busy" id="dioBusy" hidden><span class="spin"></span><span data-i18n="d.building"></span></div>
  </section>

  <!-- Google 3B: anahtar penceresi, telif satırı, yükleniyor -->
  <section class="popover g3d" id="g3dDialog" hidden aria-label="Google 3B">
    <div class="pop-head"><h2 data-i18n="g3d.title"></h2></div>
    <p class="g3d-text" data-i18n="g3d.need"></p>
    <input id="g3dKey" type="text" autocomplete="off" spellcheck="false" placeholder="AIza…">
    <p class="g3d-small"><a href="https://developers.google.com/maps/documentation/tile/get-api-key" target="_blank" rel="noopener" data-i18n="g3d.how"></a></p>
    <div class="t-actions"><button id="g3dSave" class="primary" data-i18n="g3d.save"></button><button id="g3dCancel" class="text-btn" data-i18n="g3d.cancel"></button></div>
  </section>
  <div class="g3d-credits" id="g3dCredits" hidden></div>
  <div class="busy" id="busy" hidden><span class="spin"></span></div>

  <div class="toast" id="toast" hidden></div>

  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles/pmtiles.js"></script>
  <script src="vendor/maplibre-contour.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
